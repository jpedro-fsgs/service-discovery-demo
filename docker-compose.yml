services:
  consul:
    image: hashicorp/consul:latest
    container_name: consul-server
    ports:
      - "8500:8500"
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    healthcheck:
      test: ["CMD", "consul", "info"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks: [net]

  redis:
    image: redis:7-alpine
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [net]

  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: auth-service
    environment:
      SERVICE_NAME: auth-service
      SERVICE_PORT: "3001"
      CONSUL_HOST: consul
      JWT_SECRET: ${JWT_SECRET:-emoji-social-sd-2026}
    depends_on:
      consul: { condition: service_healthy }
    networks: [net]

  posts-service:
    build:
      context: .
      dockerfile: services/posts/Dockerfile
    container_name: posts-service
    environment:
      SERVICE_NAME: posts-service
      SERVICE_PORT: "3002"
      CONSUL_HOST: consul
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-emoji-social-sd-2026}
    depends_on:
      consul: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [net]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: frontend
    ports:
      - "8080:8080"
    environment:
      SERVICE_NAME: frontend
      CONSUL_HOST: consul
    depends_on:
      consul: { condition: service_healthy }
    networks: [net]

networks:
  net:
    driver: bridge
